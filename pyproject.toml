[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcga-lm"
version = "0.1.0"
description = "Official implementation of MCGA-LM: Multimodal Context Graph-Augmented Language Model for Adaptive Intent Reconstruction in Assistive Communication"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["AAC", "assistive communication", "retrieval-augmented generation", "graph attention", "uncertainty"]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
llm = ["transformers>=4.40", "peft>=0.10", "accelerate>=0.29", "bitsandbytes>=0.43"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
